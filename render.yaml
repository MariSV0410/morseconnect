services:
  - type: web
    name: morseconnect
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: HARDWARE_MODE
        value: simulation
